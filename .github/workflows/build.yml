name: Build and Test Pull Requests
on:
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches:
      - "main"
  workflow_dispatch:
    inputs:
      version_override:
        description: "Version override"
        required: true
        type: string

jobs:
  build-and-test:
    name: Build artifacts for Python and test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11, 3.12]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Create python_version file
        shell: bash
        run: |
          echo "${{ matrix.python-version }}" > .python-version

      - name: Setup Python
        uses: actions/setup-python@master

      - name: Setup python test venv
        shell: bash
        run: |
          python -m pip install ".[dev]"

      - name: Run Pytest
        shell: bash
        run: |
          python -m pytest

      - name: Local version override
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=v${{ inputs.version_override }}" >> $GITHUB_ENV
          echo "QOALA_MLIR_VERSION=v${{ inputs.version_override }}" >> $GITHUB_ENV

      - name: Set version
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "QOALA_MLIR_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Build wheel
        shell: bash
        run: |
          python -m build --wheel

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          path: dist/*.whl
          name: euqalyptus-${{ env.QOALA_MLIR_VERSION }}-artifacts-python${{ matrix.python-version }}.whl
          retention-days: 7
          if-no-files-found: error
