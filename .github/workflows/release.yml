name: Release Workflow
on:
  push:
    # Runs on pushing a tag iff the tag has the following format
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
  workflow_dispatch:
    inputs:
      version_override:
        description: "Version override"
        required: true
        type: string

jobs:
  build-and-test:
    name: Build artifacts for Python and test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Create python_version file
        shell: bash
        run: |
          echo "${{ matrix.python-version }}" > .python-version

      - name: Setup Python
        uses: actions/setup-python@master

      - name: Setup python test venv
        shell: bash
        run: |
          python -m pip install ".[dev]"

      - name: Run Pytest
        shell: bash
        run: |
          python -m pytest

      - name: Set version on manual triggers
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=v${{ inputs.version_override }}" >> $GITHUB_ENV
          echo "EUQALYPTUS_VERSION=v${{ inputs.version_override }}" >> $GITHUB_ENV

      - name: Set version on PR
        if: github.event_name == 'pull_request'
        run: |
          echo "EUQALYPTUS_VERSION=0.0.1" >> $GITHUB_ENV

      - name: Build wheel
        shell: bash
        run: |
          python -m build --wheel

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          path: dist/*.whl
          name: euqalyptus-${{ env.EUQALYPTUS_VERSION }}-artifacts-python${{ matrix.python-version }}.whl
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [ build-and-test ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/euqalyptus
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Download built artifacts
        id: download-artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          pattern: euqalyptus-*
          merge-multiple: true

      - name: Create Release in GitHub
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.download-artifacts.outputs.download-path }}/*.whl
            ${{ steps.download-artifacts.outputs.download-path }}/*.tgz

      - name: Upload python wheels to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1.14

  release-test:
    name: Publish Release Test PyPI
    needs: [ build-and-test ]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/euqalyptus
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Download built artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          pattern: euqalyptus-*
          merge-multiple: true

#      - name: Create GitHub Release and upload artifacts
#        uses: softprops/action-gh-release@v3.0.0
#        with:
#          name: "Release ${{ github.ref_name }}"
#          draft: true
#          files: |
#            dist/*.whl

      - name: Upload python wheels to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1.14
        with:
          repository_url: https://test.pypi.org/legacy/

